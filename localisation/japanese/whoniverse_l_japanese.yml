 START_SCREEN_WHONIVERSE_SHADOW_PROCLAMATION:0 "The Shadow Proclamation, the steadfast sentinel of interstellar justice, stands poised at the heart of galactic affairs. From its tri-asteroid command center, it exerts unwavering vigilance over a tumultuous galaxy. The enforcers, led by the formidable Judoon, patrol the stars, mediating disputes and ensuring that order is maintained where diplomacy fails. Their presence is both a promise of protection and a warning to those who seek chaos.\n\nAs tensions escalate and unknown perils emerge, the Shadow Proclamation must strengthen its hold and rally its forces. The path ahead is fraught with challenges, and maintaining peace will test even their enduring resolve."

# Shadow Proclamation Plasmavore event chain

 whoniverse_plasmavore_chain_title:0 "Plasmavore"
 whoniverse_plasmavore_chain_desc:0 "We've received information about a dangerous fugitive Plasmavore. For the sake of galactic security, we must stop him."

 whoniverse.316.name:0 "Anonymous Tip"
 whoniverse.316.desc:0 "An encrypted transmission arrives at our headquarters, sent by an unknown informant. The message warns of a §RPlasmavore§! fugitive hiding on an unspecified world, possibly within our controlled space. The Plasmavore is a highly dangerous shapeshifting predator that feeds on the blood of sentient species, making it undetectable to conventional scanning methods. The informant offers a significant reward for its capture or elimination.\n\nIgnoring this threat could have dire consequences."
 whoniverse.316.a:0 "Begin tracking the Plasmavore immediately."
 whoniverse.316.b:0 "Ignore the transmission."

 whoniverse_plasmavore_project:0 "Track the Plasmavore"
 whoniverse_plasmavore_project_DESC:0 "Our analysts are working to decipher clues and triangulate the fugitive's likely location. Completing this project will allow us to pinpoint the Plasmavore's hideout and take appropriate action."

 whoniverse.317.name:0 "Plasmavore Located"
 whoniverse.317.desc:0 "After extensive research, our analysts have located the Plasmavore's hideout on one of our colonies. Judoon strike teams are being briefed and prepared for immediate deployment. The fugitive is known for employing advanced sabotage tactics, and time is critical. Failure to act promptly may give the Plasmavore the opportunity to escape or cause serious harm to the colony."
 whoniverse.317.a:0 "Deploy the Judoon strike team ASAP."
 whoniverse.317.b:0 "Abort the mission; it's too risky."

 whoniverse_plasmavore_strike_project:0 "Judoon Strike Operation"
 whoniverse_plasmavore_strike_project_DESC:0 "The Judoon strike team is undergoing final preparations for deployment. The mission is high-risk, but immediate action is necessary to prevent potential sabotage or further civilian casualties."

 whoniverse.318.name:0 "Plasmavore Neutralized"
 whoniverse.318.desc:0 "The Judoon strike team successfully neutralized the Plasmavore before it could cause significant harm. Civilian casualties were avoided, and the colony remains secure.\n\nOur anonymous informant has transferred the promised reward, recognizing our swift and decisive action. This mission has solidified our reputation as galactic enforcers."
 whoniverse.318.a:0 "Justice is served!"

 whoniverse.319.name:0 "Sabotage and Panic"
 whoniverse.319.desc:0 "The Plasmavore, now confirmed to have been hiding on one of our colonies, has struck before fleeing off-world. Using its knowledge of the colony's infrastructure, it overloaded the planetary microwave relay system, resulting in widespread destruction. Entire districts have been reduced to rubble, and countless lives have been lost.\n\nCivilians are demanding answers, and our failure to act in time has severely damaged public confidence in Shadow Proclamation's ability to protect its territories."
 whoniverse.319.a:0 "Dispatch aid and issue a formal apology."
 whoniverse.319.b:0 "This was an unforeseen consequence; no further action is needed."

 # Necros anomaly, archaeology digsite events
 whoniverse_necros_cat:0  "Dalek Technology"
 whoniverse_necros_desc:0 "Our scanners reveal traces of Dalek technology on this planet."

 whoniverse_digsite_necros:0 "Revelation of the Daleks"
 whoniverse_digsite_necros_desc:0 "Upon landing on [From.Planet.GetName], our excavation teams uncovered the ruins of a cryogenic mausoleum intertwined with faint traces of Dalek technology. Initial scans suggest this site predates the Last Great Time War, holding secrets tied to the Creator of the Daleks himself."

 whoniverse.330.name:0 "Remnants of Necros"
 whoniverse.330.desc:0 "Scans of the planet have identified faint traces of Dalek technology amidst the ruins of a planet-wide cryogenic mausoleum. This world, scarred and abandoned, holds echoes of Dalek activity that predate the §LLast Great Time War§!.\n\nThe origin of these readings is unknown, but the potential to uncover lost Dalek secrets demands investigation. We must deploy excavation teams to the surface to uncover the true significance of Necros."
 whoniverse.330.a:0 "Begin the excavation!"

 whoniverse.331.name:0 "Tranquil Repose"
 whoniverse.331.desc:0 "Excavations on Necros have revealed the decayed remains of §LTranquil Repose§!, a facility that once specialized in cryogenic preservation. Before the Last Great Time War, this site served as both a mausoleum for wealthy civilizations and a secret hub of activity for the Daleks.\n\nFurther investigation suggests that Tranquil Repose also housed one of the laboratories of §HDavros§!, the Creator of the Daleks. His experiments here advanced the designs of our kind and established Necros as a hidden outpost of the Dalek Empire. Though the surface structures are ruined, evidence of subterranean chambers has reignited our excavation efforts."
 whoniverse.331.a:0 "Keep digging!"

 whoniverse.332.name:0 "The Laboratory of Davros"
 whoniverse.332.desc:0 "Beneath the ruins of Tranquil Repose, our excavation teams have uncovered one of Davros's secret laboratories. During the era preceding the Last Great Time War, this facility served as a pivotal site for advancing Dalek evolution and developing new military strategies.\n\nThe laboratory remains dormant but largely intact. While its systems are currently inert, preliminary analysis suggests that reactivating the facility could unlock its full potential. For now, we must dig deeper to uncover the truth of Davros's experiments."
 whoniverse.332.a:0 "Keep digging."
 whoniverse.332.a.tooltip:0 "§HDalek Incubation Vats§! will be built on §Y[From.Planet.GetName]§!."
 whoniverse.332.b:0 "Destroy the facility for good!"

 whoniverse.333.name:0 "Necros Daleks"
 whoniverse.333.desc:0 "At the heart of Davros's laboratory, we have discovered fully preserved incubation vats and an enormous cryogenic chamber that has survived intact since the era before the Last Great Time War. These chambers house legions of Type VI Daleks, engineered by Davros as elite soldiers. However, their genetic code contains subtle deviations from the pure Dalek template.\n\nThe facility's systems are now operational, and the chambers could be reactivated with minimal effort, allowing these Necros Daleks to bolster our forces. Yet their impurity poses a grave risk to the genetic perfection of the Dalek race. The time has come to decide: Will we harness their power for conquest, or purge them in the name of purity?"
 whoniverse.333.a:0 "Reawaken the Necros Daleks!"
 whoniverse.333.a.tooltip:0 "§HDalek Incubation Vats§! will be built on §Y[From.Planet.GetName]§!.\n6 §HDalek§! pops will be added to §Y[From.Planet.GetName]§!."
 whoniverse.333.b:0 "Purge the Necros Daleks. Imperfection cannot be tolerated!"

# Spiridon anomaly, archaeology digsite events

 whoniverse_name_spiridon_system:0 "Spiridon"
 whoniverse_name_spiridon_planet:0 "Spiridon"
 Spiridon:0 "Spiridon"

 whoniverse_name_spiridon:0 "Spiridon"
 whoniverse_spiridon_cat:0  "Energy Signatures"
 whoniverse_spiridon_desc:0 "Scanners reveal energy signatures of Dalek technology beneath this planet's dense jungle surface."
 SPIRIDON_FLEET:0 "Spiridon Dalek Fleet"
 DALEK_SHUTTLE:0 "Dalek Transport Shuttle"
 SPIRIDON_DALEK_ARMY:0 "Spiridon Dalek Army"

 whoniverse_digsite_spiridon:0 "Planet of the Daleks"
 whoniverse_digsite_spiridon_desc:0 "Hidden beneath the dense jungles of [From.Planet.GetName], the ruins of a massive Dalek facility lie entangled in roots and soil, a stark reminder of the battles waged here long ago."

 whoniverse.340.name:0 "Planet of the Daleks"
 whoniverse.340.desc:0 "Landing on [From.Planet.GetName], our drones are immediately challenged by the dense Spiridon jungle, a chaotic tangle of vegetation teeming with life. Beneath this vibrant surface lie ruins partially submerged in pools of hardened molten ice. The decayed structures and corroded machinery hint at a catastrophic event that brought this Dalek facility to ruin.\n\nHistorical data suggests this world served as a staging ground for Dalek operations, with the local §HSpiridon§! population reduced to slaves under their rule. Further exploration may reveal what truly transpired here."
 whoniverse.340.a:0 "Curious."

 whoniverse.341.name:0 "Forgotten Conflict"
 whoniverse.341.desc:0 "Our teams have uncovered fragments of shattered machinery and scattered Dalek components, entombed in layers of hardened molten ice and vegetation. These remains show clear signs of battle - energy burns, punctures, and marks of sabotage. Records suggest that a §HThal§! strike team, aided by an enigmatic figure referred to as §lThe Doctor§!, infiltrated the Dalek facility to sabotage their operations.\n\nThe facility appears to have been a production site, but its exact purpose remains unclear."
 whoniverse.341.a:0 "Keep digging."

 whoniverse.342.name:0 "Weapons of Desperation"
 whoniverse.342.desc:0 "Deeper exploration reveals caches of primitive but effective weapons, likely crafted under the Thals' direction. Maps etched onto salvaged materials reveal how the dense jungle and molten ice pools were used to orchestrate ambushes, disrupting Dalek patrols. Despite overwhelming odds, the Thals' sabotage efforts escalated to the point of crippling Dalek operations.\n\nAdditional findings suggest the Daleks attempted to deploy a §Rbacterial weapon§! designed to eradicate all life on the planet, Spiridon slaves included. However, the plan failed spectacularly, leaving behind data fragments that could prove valuable."
 whoniverse.342.a:0 "Extract the data and continue excavation!"

 whoniverse.343.name:0 "The Spiridon Sacrifice"
 whoniverse.343.desc:0 "Among the ruins are haunting reminders of the Spiridons' tragic role in this conflict. While some Spiridons aided the Thals, most were pressed into servitude by the Daleks, forced to labor in unbearable conditions. Dalek research logs confirm their cruel experiments to replicate the Spiridons' natural invisibility. Though initial trials succeeded, the process left invisible Daleks vulnerable to light wave sickness, rendering them immobile.\n\nRecovered evidence indicates the Thals' final sabotage efforts were far more extensive than previously thought, targeting the core systems of this facility. A decisive confrontation looms beneath the frozen ruin."
 whoniverse.343.a:0 "Keep digging!"

 whoniverse.344.name:0 "The Frozen Army"
 whoniverse.344.desc:0 "In the heart of the Dalek facility, our teams have uncovered a vast cooling chamber containing a massive Dalek army, frozen in stasis for centuries. Logs confirm this army was destined to spearhead a galactic invasion before a final act of sabotage, orchestrated by the Thals and §lThe Doctor§!, caused molten ice to flood the chamber, halting the revival process.\n\nEvidence of the desperate battle lingers: shattered Dalek casings, improvised explosives, and molten ice sealing the army's fate. Now, the decision is ours: Should we disturb this icy tomb and risk what lies within, or leave it untouched?"
 whoniverse.344.a:0 "Reactivate the Dalek army."
 whoniverse.344.a.tooltip:0 "The Dalek army will be reactivated... The consequences are unpredictable."
 whoniverse.344.b:0 "Destroy the Dalek army for good!"
 whoniverse.344.c:0 "Purge the Daleks and harvest their technology."
 whoniverse.344.d:0 "Seal the chamber and let them rest in eternity."

# Roboform random event
 whoniverse.351.name:0 "The Christmas Invasion"
 whoniverse.351.desc:0 "Unusual activity has been detected on §Y[From.Planet.GetName]§!. A group of android scavengers, crudely disguised as mythical §LSanta Claus§! figures, has landed on the surface. These so-called §HRoboforms§! are believed to have been drawn to the planet by the residual energy signatures of incoming invasions. Armed with concealed weapons and malfunctioning cheer protocols, they have begun scavenging resources and alarming the populace.\n\nWhile these units could pose a threat, they also present an opportunity: with proper handling, their systems might be adapted for productive use. The decision lies in how we respond to these seasonal intruders."
 whoniverse.351.a:0 "Capture and reprogram the Roboforms."
 whoniverse.351.a.tooltip:0 "2 §HRoboform§! pops added to §Y[From.Planet.GetName]§!."
 whoniverse.351.b:0 "Recruit the Roboforms into our forces."
 whoniverse.351.b.tooltip:0 "3 §HRoboform Armies§! appear on §Y[This.GetName]§!."
 whoniverse.351.c:0 "This is too risky. Expel the Roboforms from our planet!"
 whoniverse.351.d:0 "EXTERMINATE the Roboforms!"
 whoniverse.351.e:0 "Assimilate the Roboforms into our ranks."
 whoniverse.351.e.tooltip:0 "2 §HCyberman§! pops will be added to §Y[From.Planet.GetName]§!."
 
