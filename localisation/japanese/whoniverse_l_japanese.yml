# Dalek Empire Remnants empire events

 whoniverse.203.name:0 "Rebirth of the Dalek Empire"
 whoniverse.203.desc:0 "Victory is ours! The conquest of [Root.GetName] signals the resurgence of Dalek supremacy. Our forces have begun the systematic extermination and processing of the planet's population, fueling the rebirth of our glorious empire. The [Root.Owner.GetRulerTitle] decrees that the time has come to reclaim our rightful place in the galaxy.\n\nThe name of the §HDalek Empire§! will once again strike terror into the hearts of all life forms. The universe will be purged of the weak, and all who oppose us shall be exterminated!"
 whoniverse.203.a:0 "The Daleks reign supreme! All hail the Dalek Empire!"
 whoniverse.203.a.tooltip:0 "Empire changes name to §SDalek Empire§!"
 whoniverse.203.b:0 "Negative. The Daleks will remain in secrecy!"

### DALEK CIVIL WAR ###

 START_SCREEN_WHONIVERSE_IMPERIAL_DALEKS:0 "Long before the Last Great Time War, Davros gave rise to a new race of Daleks, much to the dismay of the Dalek Prime. Upon arriving on Skaro, he proclaimed himself the new Dalek Emperor, asserting his dominance over the Dalek race. Following the narrow escape of the Dalek Prime and his loyalists to a different point of time and space, Davros branded them as Renegade Daleks, enemies of his regime.\n\nTo further consolidate his power, Davros is currently developing a time corridor that will lead into the reality shaped by the aftermath of the Last Great Time War. Through this corridor, he aims to uncover the hidden stronghold of the Renegades, who continue to oppose his absolute rule.\n\nThe countdown to an all-out Imperial-Renegade Dalek Civil War looms ever closer, as Davros prepares to eliminate his foes and solidify his legacy as the supreme leader of the Daleks."

 START_SCREEN_WHONIVERSE_RENEGADE_DALEKS:0 "Once united under a common purpose, the Dalek race was fractured when Davros engineered a new breed of Daleks, much to the dismay of his original creations. Upon seizing Skaro and proclaiming himself Emperor, Davros drove the Dalek Prime and his loyalists to escape into the depths of time and space, where they found refuge in the hidden Thule system.\n\nNow, in their stronghold within Thule, the Renegade Daleks rally under their unyielding leader, rejecting Davros's altered creations and vowing to reclaim Skaro to restore the purity of their kind.\n\nAs the Renegade Daleks mobilize to defy Davros, the galaxy braces for an all-consuming conflict. With their sights set firmly on Skaro, they prepare to seize their destiny and cleanse the Dalek race of Davros's influence." 

 origin_whoniverse_dalek_civil_war:0 "Dalek Civil War"
 origin_whoniverse_dalek_civil_war_desc:0 "§RWARNING: Challenging Origin§!\nLong before the Last Great Time War, the Daleks were divided. The Imperial Daleks, led by Davros from Skaro, seek to hunt down the Renegade Daleks, loyal to Dalek Prime and hiding in a different point of time. Both factions aim to use time corridor technology to gain supremacy, with the fate of the Dalek race - and the galaxy - hanging in the balance."

