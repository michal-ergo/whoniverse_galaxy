# Sontaran origin, trait, start screen
 origin_whoniverse_sontaran:0 "The Sontaran Stratagem"
 origin_whoniverse_sontaran_desc:0 "Engineered for war, the Sontarans thrive in the harsh gravity of their homeworld, where endless ranks of cloned soldiers are bred for conquest. With their eternal war against the Rutan Host looming over the stars, the Sontarans march ever forward, seeking glory through relentless battle."

 origin_tooltip_whoniverse_sontaran:2 "- $SPECIES_TRAITS$ $TABBED_NEW_LINE$- ['concept_whoniverse_sontaran_infertile'] $NEW_LINE$- $HOMEWORLD$$TABBED_NEW_LINE$- ['concept_whoniverse_pm_sontaran_gravity'] planet modifier$NEW_LINE$- $ADDITONAL_TECHNOLOGIES_STRING$ $TABBED_NEW_LINE$- ['concept_genome_mapping', £society_research£ $tech_genome_mapping$] $TABBED_NEW_LINE$- ['concept_cloning', £society_research£ $tech_cloning$] $TABBED_NEW_LINE$- ['concept_centralized_command', £society_research£ $tech_centralized_command$] $NEW_LINE$- Unique §HThe Great Sontaran War§! event chain"

 START_SCREEN_WHONIVERSE_SONTARAN:0 "Born for war, forged in the fires of endless battle, the Sontaran race knows only one purpose: conquest. From the cloning vats of Sontar, generations of perfect warriors have marched forth, their discipline unyielding, their resolve absolute. Honor is their code, war is their existence, and glory is their ultimate reward.\n\nFor centuries, their empire has expanded across the stars, yet one war remains unfinished - the eternal struggle against the hated Rutan Host. The battle has raged for millennia, spanning entire worlds, with neither side willing to relent.\n\nBut the time for stalemates is over. The Sontaran Empire stands ready to claim final victory. Its armies are strong, its fleets prepared, its soldiers eager to die in service of the cause. For the glory of Sontar!"

 trait_whoniverse_sontaran_infertile:0 "Clone Warrior"
 trait_whoniverse_sontaran_infertile_desc:0 "Engineered for battle, these soldiers are infertile but possess exceptional combat prowess."

 civic_whoniverse_glory_in_battle:0 "Glory in Battle"
 civic_whoniverse_glory_in_battle_desc:0 "War is not just a necessity - it is the highest honor. Every battle fought, every enemy slain, and every soldier who dies in combat brings glory to the empire."

 councilor_whoniverse_glory_in_battle:0 "Field Major"
 councilor_whoniverse_glory_in_battle_desc:0 "The $TITLE$ is responsible for overseeing our soldiers."

 decision_whoniverse_caesofine_gas:0 "Release Caesofine Gas"
 decision_whoniverse_caesofine_gas_desc:0 "Release caesofine gas into the atmosphere to increase the planet's cloning capabilities. This will make it more suitable for Sontarans, but will also poison pops of other species."

 whoniverse_caesofine_gas_tooltip:0 "\nEach non-§YClone Warrior§! pop: §Rdies§!"

 whoniverse_pm_caesofine_gas:0 "Caesofine Gas"

# Great Sontaran War event chain
 whoniverse_the_great_sontaran_war_chain_title:0 "The Great Sontaran War"
 whoniverse_the_great_sontaran_war_chain_desc:0 "The Great Sontaran War is an endless conflict against the hated §RRutan Host§!, waged across the stars for thousands of years.\n\nTrue victory can only be achieved by finding and conquering §YRuta III§!, the heart of the Rutan menace, and ending their threat once and for all."

 triggered_whoniverse_sontaran_opinion_of_rutans:0 "Hated Enemies"
 triggered_whoniverse_rutan_opinion_of_sontarans:0 "Hated Enemies"

 whoniverse_name_sentarion_wormhole_system:0 "Sentarion"
 
 NAME_whoniverse_sentarii_confederation:0 "Sentarii Confederation"
 NAME_sentarii_army:0 "Sentarii Army"

 whoniverse.383.name:0 "The Great Sontaran War"
 whoniverse.383.desc:0 "For millennia, the Sontaran Empire has waged war against the treacherous §RRutan Host§!, a race of shapeshifting, bioelectric creatures lurking in the galactic shadows. Driven from their former dominion, they now strike from the dark, infiltrating worlds and sabotaging fleets with cowardly tactics.\n\nTrue victory can only come with the conquest of §HRuta III§!, the hive-world of their Queen. Until then, the war must rage on - no Sontaran may rest while the enemy still breathes! Glory lies only in battle!"
 whoniverse.383.a:0 "Sontar-ha!"

 whoniverse.385.name:0 "Victory at Last!"
 whoniverse.385.desc:0 "After countless generations of war, the [From.Owner.GetName] has achieved the ultimate victory - §Y[From.GetName]§! has fallen! The wretched bio-forms that once infested this world have been exterminated, their strongholds reduced to rubble. The last bastion of our eternal enemy is ours, and the glory of our warriors shall be sung for eternity!\n\nThis is the greatest triumph in Sontaran history! The Great Sontaran War is over, and the Empire stands supreme!"
 whoniverse.385.a:0 "Sontar-ha! Let the victory be known!"

 whoniverse.386.name:0 "The Fallen Stronghold"
 whoniverse.386.desc:0 "§Y[From.GetName]§! now flies the banner of the [From.Owner.GetName]. The once-dreaded homeworld of our eternal foe lies silent, its cities shattered and its bio-organic structures long since decayed. This world may no longer be the stronghold of the §HRutan Host§!, but it is still a victory - a world wrested from their history, a monument to Sontaran supremacy!\n\nEven in absence, our enemies suffer defeat. Their home is now ours, and their legacy is reduced to dust."
 whoniverse.386.a:0 "Sontar-ha! Another step toward total conquest!"

 whoniverse_sontaran_war_rutan_victory:0 "Conqueror of the Rutans"

### Donna Noble Recruit Event Chain ###

 whoniverse_donna_chain_title:0 "The Runaway Bride"
 whoniverse_donna_chain_desc:0 "A bride vanishes from her wedding and appears aboard the TARDIS. What force could pull her across time and space?"

 whoniverse.931.name:0 "The Runaway Bride"
 whoniverse.931.desc:0 "The §BTARDIS§! interior lights flare as a surge of unknown energy fills the control room - and suddenly, a woman in a wedding dress materializes mid-shout.\n\n§H"Who are you? Where am I? What the hell is this place?"§!\n\nShe claims to be §rDonna Noble§!, moments away from her wedding, and demands to be taken back to Earth immediately. Scans reveal an alarming trace of huon particles in her body - long-extinct temporal energy. Something is very wrong."
 whoniverse.931.a:0 "Take her home."
 whoniverse.931.b:0 "Eject her at the nearest planet."

 whoniverse_donna_wedding_project:0 "Return Donna to the Wedding"
 whoniverse_donna_wedding_project_DESC:0 "Go to [Root.Owner.Capital.GetName] and return Donna Noble to her wedding."

 whoniverse.932.name:0 "Crashed Wedding"
 whoniverse.932.desc:0 "Donna is returned just in time for her wedding, but the reception ends in chaos - §RRoboforms§! disguised as Santa Clauses attack, attempting to abduct her.\n\nAmid the confusion, the Doctor discovers that both Donna and her fiancé Lance are employees of §LH. C. Clements§!, a firm owned by the now-defunct Torchwood Institute."
 whoniverse.932.a:0 "Investigate the company."
 whoniverse.932.b:0 "Probably just a coincidence."

 whoniverse_donna_investigate_project:0 "Investigate H. C. Clements"
 whoniverse_donna_investigate_project_DESC:0 "Investigate the H.C. Clements building on [Root.Owner.Capital.GetName]."

 whoniverse.933.name:0 "The Empress of the Racnoss"
 whoniverse.933.desc:0 "A hidden tunnel beneath the H.C. Clements building leads deep into Earth's crust. At its entrance stands the §REmpress of the Racnoss§!, an ancient, spider-like being from the Dark Times. She reveals that Lance has been secretly dosing Donna with huon particles, transforming her into a key - one that will awaken her children, hibernating inside a spaceship hidden at Earth's core.\n\n§R\"The Secret Heart unlocks, and they will waken from their sleep of ages!\"§!\n\nBefore she can enact her plan, the Doctor and Donna narrowly escape - but the Empress teleports away."
 whoniverse.933.a:0 "She won't get far. Prepare to intercept!"
 
 whoniverse.934.name:0 "The Webstar Emerges"
 whoniverse.934.desc:0 "A massive eight-pointed starship descends from orbit - the §HWebstar§! of the Racnoss Empress, long hidden in the void since the Dark Times. Now returned to Earth, it begins draining planetary resources to reawaken her ancient swarm.\n\nYou must intervene - now."
 whoniverse.934.a:0 "All forces, engage!"
 whoniverse.934.a.tooltip:0 "§RRacnoss Webstar§! appears on [Root.Owner.Capital.GetName]"

 NAME_Webstar:0 "Webstar"
 RACNOSS_ARMY:0 "Racnoss Army"

 whoniverse.935.name:0 "A Noble Spirit"
 whoniverse.935.desc:0 "The Webstar is destroyed. The Racnoss are driven back once more. Donna, though shaken, stood firm through every moment. Impressed by her prowess, the Doctor considers inviting her aboard as a companion."
 whoniverse.935.a:0 "§HOpen communications channel!§!"
 whoniverse.935.b:0 "She belongs on Earth, not among the stars."

 whoniverse.937.name:0 "The Secret Heart Awakens"
 whoniverse.937.desc:0 "With no one to stop her, the §REmpress of the Racnoss§! completes her plan. Using Donna Noble as an unwitting key, she unlocks the §HSecret Heart§! buried at Earth's core - an ancient Racnoss ark containing her dormant children.\n\nAs the planet trembles, the §HWebstar§! - the Empress's personal warship from the Dark Times - descends from orbit. Simultaneously, the §HSecret Heart§! erupts from beneath the Earth's crust, tearing through tectonic plates and igniting the oceans.\n\nTwin stars of destruction now hang over Earth, and the Racnoss swarm begins its conquest anew."
 whoniverse.937.a:0 "This should have been prevented..."
 whoniverse.937.a.tooltip:0 "§RRacnoss Webstar§! appears on [Root.Owner.Capital.GetName]"

# Donna Noble hire
 whoniverse.936.name:0 "NAME_whoniverse_donna_noble_name"
 whoniverse.936.desc:0 "One minute I'm walking down the aisle, next thing I know I'm on a spaceship with killer Santas and a spider from the centre of the Earth. And I didn't even get to eat any cake!"

 whoniverse_donna_noble_country:0 "The Doctor's Companion"
 NAME_whoniverse_donna_noble_species:0 "Human"
 NAME_whoniverse_donna_noble_name:0 "Donna Noble"
 whoniverse_donna_noble_catch_phrase:0 "Oi! Watch it, spaceman!"
 whoniverse_donna_noble_backstory:0 "Before being caught up in the Doctor's adventures, Donna Noble was a temp from Chiswick. Though not a scientist or soldier, her courage, blunt honesty, and refusal to back down in the face of danger make her a powerful ally. Her unexpected journey began on her wedding day... and changed her forever."

 whoniverse.936.a:0 "So, what will you do with yourself now?"
 whoniverse.936.a.response:0 "Not getting married, for starters. And I'm not going to temp anymore.\n\nI don't know. Travel. See a bit more of planet Earth. Walk in the dust. Just go out there and do something."

 whoniverse.936.b:0 "Well, you could always come with me."
 whoniverse.936.b.response:0 "What?\n\nNo.\n\nI can't.\n\nI can come?"

 whoniverse.936.c:0 "I just want a mate."
 whoniverse.936.c.response:0 "You just want to mate?!\n\nYou're not mating with me, sunshine!"

 whoniverse.936.d:0 "§lInvite her aboard§!"
 whoniverse.936.d.custom_tooltip:2 "§Y$NAME_whoniverse_donna_noble_name$§! joins our Empire as a §HLeader§!."

 whoniverse.936.e:0 "§RDismiss§!"

