# Dalek Civil War civics

 civic_whoniverse_imperial_daleks:0 "Imperial Dalek Doctrine"
 civic_whoniverse_imperial_daleks_desc:0 "This Dalek faction is devoted to the absolute unification of all Daleks under their creator's rule, using advanced biotechnological and time-travel methods to achieve dominance."

 councilor_whoniverse_imperial_daleks:0 "Supreme Dalek"
 councilor_whoniverse_imperial_daleks_desc:0 "Supreme Dalek is a name given to a Dalek, usually within the Black Dalek ranks, to serve the role of a commander."

 civic_whoniverse_renegade_daleks:0 "Renegade Dalek Resistance"
 civic_whoniverse_renegade_daleks_desc:0 "Loyal to Dalek Prime, the Renegade Daleks reject the rule of Davros and aim to preserve the original Dalek hierarchy through ruthless military discipline and isolation."

 councilor_whoniverse_renegade_daleks:0 "Supreme Dalek"
 councilor_whoniverse_renegade_daleks_desc:0 "Supreme Dalek is a name given to a Dalek, usually within the Black Dalek ranks, to serve the role of a commander."

# Dalek Civil War (Imperial) Events

 whoniverse_dalek_imperial_chain_title:0 "Dalek Civil War"
 whoniverse_dalek_imperial_chain_desc:0 "The Daleks are divided between the Imperial Daleks, loyal to their creator Davros, and the Renegade Daleks, who remain loyal to Dalek Prime. We must find the secret Dalek renegade base and seize it."

 whoniverse_dalek_renegade_chain_title:0 "Dalek Civil War"
 whoniverse_dalek_renegade_chain_desc:0 "The Daleks are divided between the Imperial Daleks, loyal to their creator Davros, and the Renegade Daleks, who remain loyal to Dalek Prime. We must find way back to Skaro and reclaim it from the Imperials' grasp."

 whoniverse.280.name:0 "Dalek Civil War"
 whoniverse.280.desc:0 "Our forces have successfully utilized the time corridor, breaching into a timeline existing within a future continuum shaped by the §LLast Great Time War§!. This unexplored space-time offers a unique opportunity to locate and eliminate the §RRenegade Daleks§!, who have hidden themselves beyond the reach of Imperial sensors. The final conflict for control of the Dalek race is approaching!"
 whoniverse.280.a:0 "Locate and exterminate the Renegade Daleks!"

 whoniverse.282.name:0 "Remembrence of the Daleks"
 whoniverse.282.desc:0 "Our Emperor, [Root.Owner.GetRulerTitle], has identified the location of the legendary §GHand of Omega§! - a device of incredible power capable of manipulating the very stars. It is believed to be hidden on Earth, in the year 1963, but our efforts to retrieve it are complicated by the presence of §RRenegade Daleks§!, who seek the device for their own purposes.\n\n[Root.Owner.GetRulerTitle] orders the creation of a time corridor to breach this point in space-time. A special project is required to establish this corridor."
 whoniverse.282.a:0 "Commence the operation to locate the Hand of Omega!"
 whoniverse.282.b:0 "Negative! Abort the operation."

 whoniverse_imperial_remembrence_project:0 "Remembrence of the Daleks"
 whoniverse_imperial_remembrence_project_DESC:0 "Open a time corridor to 1963 Earth and locate the Hand of Omega."

 whoniverse.283.name:0 "The Hand Slips Away"
 whoniverse.283.desc:0 "Our reports indicate that the §RRenegade Daleks§! have successfully claimed the §lHand of Omega§! for themselves. This is a grave setback for the Imperial cause, as the Renegades now hold a significant advantage."
 whoniverse.283.a:0 "We will destroy them anyway!"

 whoniverse.284.name:0 "Hand of Omega Located"
 whoniverse.284.desc:0 "The time corridor has been successfully established, leading to Earth, 1963. Our scouts have located the §GHand of Omega§! in London. However, the situation is more complicated than anticipated: both the Doctor and Renegade Daleks are also present.\n\nTo secure the relic, we will need to deploy a military landing party. The Emperor orders an immediate assault."
 whoniverse.284.a:0 "Prepare the landing party!"

 whoniverse_imperial_omega_project:0 "Retrieve the Hand of Omega"
 whoniverse_imperial_omega_project_DESC:0 "Send a Dalek landing party through the time corridor to retrieve the Hand of Omega."

 whoniverse_r_hand_of_omega:0 "Hand of Omega"
 whoniverse_r_hand_of_omega_desc:0 "The Hand of Omega, also known as the Omega device by the Daleks, is a remote stellar manipulator, used by Omega and Rassilon in the antiquity of Gallifrey. It has the ability to turn stars into supernovas in order to fuel Gallifreyan time travel."

 whoniverse.285.name:0 "Destruction of [Root.Owner.Capital.GetName]"
 whoniverse.285.desc:0 "Our project has failed catastrophically. In a desperate attempt to harness the power of the §GHand of Omega§!, [Root.Owner.Ruler.GetName] activated the device prematurely. However, something went terribly wrong, and one of the stars in the [Root.Owner.Capital.GetName] system has gone supernova, obliterating our homeworld. Initial analysis suggests that an unknown manipulation of the device caused this devastating outcome."
 whoniverse.285.a:0 "§RDanger! Instability! Reaction out of control!§!"

 whoniverse.286.name:0 "Omega Device Secured"
 whoniverse.286.desc:0 "The military landing party has successfully retrieved the §GHand of Omega§! from Earth, 1963. Despite interference from the Doctor and Renegade Daleks, our forces managed to escape back through the time corridor with the relic.\n\n[Root.Owner.GetRulerTitle] [Root.Owner.Ruler.GetName] has begun preparations for activating the device, confident that its power can be used to benefit the Imperial Dalek cause. However, there remains uncertainty about its stability. Proceeding hastily could result in catastrophic failure."
 whoniverse.286.a:0 "Activate the Omega device immediately!"
 whoniverse.286.b:0 "Delay activation and analyse the device!"

 whoniverse.287.name:0 "The Doctor's Treachery Uncovered"
 whoniverse.287.desc:0 "Upon delaying the activation of the §GHand of Omega§! and conducting further analysis, our scientists have uncovered subtle alterations to the device's programming. It appears that the Doctor had sabotaged the Hand of Omega, setting it to destroy any star it is used on by triggering a supernova. Thankfully, [Root.Owner.GetRulerTitle] [Root.Owner.Ruler.GetName] has successfully reversed these alterations, and the Hand of Omega is now under Imperial control, ready to harness the energy of stars for our cause."
 whoniverse.287.a:0 "The Doctor will pay for this!"

 whoniverse.289.name:0 "Renegade Base Captured"
 whoniverse.289.desc:0 "Our forces have successfully seized the secret base of the §RRenegade Daleks§! in the Thule system. With their leadership fractured and their forces scattered across the galaxy, we now face a pivotal choice: shall we reprogram these Renegade units into loyal Imperial Daleks, or initiate their complete extermination under purge protocols?"
 whoniverse.289.a:0 "Reprogram the Renegades to serve the Emperor!"
 whoniverse.289.a.tooltip:0 "§HRenegade Daleks§! on Thule will be immediately converted into §HImperial Daleks§!."
 whoniverse.289.b:0 "Purge them! The Renegades shall be exterminated!"

 whoniverse_imperial_dalek_victory:0 "Renegade Faction Defeated"
 whoniverse_renegade_dalek_victory:0 "Imperial Faction Defeated"

 whoniverse.290.name:0 "Losing Himself"
 whoniverse.290.desc:0 "[Root.Owner.Ruler.GetName], once the genius creator of the Daleks, now teeters on the edge of sanity. His mind is divided between two warring personas: [Root.Owner.Ruler.GetName], the brilliant Kaled scientist, and the §YEmperor Dalek§!, a fully Dalek-like entity who views the original [Root.Owner.Ruler.GetName] as a fool. \n\nIn a desperate attempt to retain his identity, [Root.Owner.Ruler.GetName] created a clone body in hopes of transferring his original personality into it, freeing himself from the influence of the Emperor. However, the Daleks themselves have grown wary of [Root.Owner.Ruler.GetName]' instability. They have destroyed his cloned body before his eyes, causing a severe psychological collapse.\n\nWith his original personality fading, the Emperor Dalek persona threatens to take over completely, leaving only itself to rule over the Imperial forces."
 whoniverse.290.a:0 "Assist [Root.Owner.Ruler.GetName] in reasserting control!"
 whoniverse.290.a.tooltip:0 "[Root.Owner.Ruler.GetName] changes portrait."
 whoniverse.290.b:0 "The Emperor shall reign supreme!"

 whoniverse.291.name:0 "Dalek Civil War"
 whoniverse.291.desc:0 "Our scientists have achieved a breakthrough with the §Ltime controller§!, allowing us to access a time corridor leading into an alternate continuum shaped by the §LLast Great Time War§!. Through this corridor, we may reach the distant timeline where the Imperial Daleks currently control Skaro. This presents an opportunity to confront our enemies head-on, reclaim our homeworld, and restore the purity of the Dalek race."
 whoniverse.291.a:0 "Locate the Imperial Daleks!"

 whoniverse.292.name:0 "Omega Device Secured"
 whoniverse.292.desc:0 "Through meticulous planning, our agents succeeded in infiltrating Earth in the year 1963, securing the §lHand of Omega§! before the §RImperial Daleks§! could lay their claim to it. This invaluable artifact, a relic of the Time Lords, is now under our control. Our scientists quickly stabilized its immense energy and uncovered a trap hidden by §lthe Doctor§! - intended to destroy any who attempted to misuse the device. With precise expertise, we have neutralized this threat, and the Omega device is now fully operational, ready to empower our quest for supremacy."
 whoniverse.292.a:0 "The Hand of Omega is ours!"

 whoniverse.293.name:0 "Imperial Daleks Secured the Omega Device"
 whoniverse.293.desc:0 "Our surveillance reports that the §RImperial Daleks§! have successfully obtained the §lHand of Omega§!, a weapon of incalculable power. With this artifact, their strength grows, posing a far greater threat to our efforts. Their ambitions are now even more dangerous, and time is running short. We must act swiftly to counter this new imbalance."
 whoniverse.293.a:0 "They will pay for this!"

 whoniverse.294.name:0 "Destruction of Skaro"
 whoniverse.294.desc:0 "Our intelligence confirms that the §RImperial Daleks§! have miscalculated in their use of the §lHand of Omega§!. In their reckless attempts to wield its power, they have triggered a catastrophic event: Skaro's second sun has gone supernova, consuming their capital planet and annihilating their primary base. This misstep marks a momentous victory for the §HRenegade Daleks§!. Without Skaro, the Imperials are crippled and will struggle to recover from such a blow."
 whoniverse.294.a:0 "Witness the fall of the false Emperor!"

 whoniverse.295.name:0 "Victory on Skaro!"
 whoniverse.295.desc:0 "Our forces have triumphed on the irradiated plains of Skaro, overcoming the last defenses of the §RImperial Daleks§!. The stronghold of the Emperor has fallen, and Davros's twisted creations have been subdued. With Skaro back in Renegade control, we have the opportunity to reshape the future of the Dalek race. Will we exterminate the remnants of these corrupted Imperials, or repurpose them to strengthen our ranks?"
 whoniverse.295.a:0 "Reprogram them into loyal Renegades!" 
 whoniverse.295.b:0 "Exterminate the Imperial Daleks!"


