 decision_whoniverse_dinosaurs_remove:0 "Dinosaur Fauna Removal"
 decision_whoniverse_dinosaurs_remove_desc:0 "With advancements in terraforming technology, it is now possible to remove hostile species from a planet without disrupting the biosphere."

 decision_whoniverse_dinosaurs_add:0 "Introduce Dinosaur Fauna"
 decision_whoniverse_dinosaurs_add_desc:0 "Bring a small dinosaur population to the planet, which will then be quickly expanded to the entire ecosystem by use of genetic technology."

 origin_whoniverse_silurian:0 "Legacy of the Silurians"
 origin_whoniverse_silurian_desc:0 "The Silurians and their aquatic cousins, the Sea Devils, evolved on an ancient world rich in life, mastering both technology and the natural world long before other civilizations appeared. However, they now face an impending cataclysm that could drive them into extinction."

 origin_tooltip_whoniverse_silurian:2 "- $HOME_SYSTEM$ $TABBED_NEW_LINE$- Wormhole-locked system$NEW_LINE$- Start with §H8§! pops with ocean preference$NEW_LINE$- Guaranteed Research Options: $TABBED_NEW_LINE$['concept_wormhole_stabilization', £physics_research£ $tech_wormhole_stabilization$] (§G+75 %§!) $NEW_LINE$- Unique §HComing Cataclysm§! event chain"

 START_SCREEN_WHONIVERSE_SILURIAN:0 "Long before the rise of any other spacefaring civilization, the Silurians ruled their world with unmatched intellect and precision. Masters of genetics, engineering, and the natural order, they coexisted with a planet teeming with towering dinosaurs. Alongside their aquatic kin, the Sea Devils, they built great cities both on land and beneath the waves, their dominion absolute.\n\nYet, even in an age of prosperity, shadows linger on the horizon. Some among the scholars and astronomers speak in hushed tones of troubling signs - patterns in the stars, anomalies in the deep. The future of the Silurian race may not be as secure as it seems.\n\nFor now, the great Silurian Empire stands unchallenged. But in the face of the unknown, survival demands vigilance, wisdom... and perhaps, a bold new path beyond the confines of this world."

 # Silurian Cataclysm event chain

 whoniverse_coming_cataclysm_chain_title:0 "Coming Cataclysm"
 whoniverse_coming_cataclysm_chain_desc:0 "A small planetoid, moving on a perilous trajectory, approaches our world. Our civilization faces a dire choice as we prepare for the inevitable."

 whoniverse.366.name:0 "Coming Cataclysm"
 whoniverse.366.desc:0 "Our astronomers have identified a celestial body at the edge of our solar system. While it appears small by cosmic standards, its proximity and trajectory raise grave concerns. Initial calculations suggest it will pass dangerously close to our planet, but the exact impact remains uncertain.\n\nThe §LTriad§!, our most trusted council, has called for calm as observations continue."
 whoniverse.366.a:0 "Worrying."

 whoniverse.367.name:0 "Portents of Doom"
 whoniverse.367.desc:0 "The calculations are complete, and the implications are devastating. The small planetoid, though not large enough to destroy our planet outright, will pass so close that it will strip the atmosphere away, making the surface uninhabitable for countless millennia.\n\nThe §LTriad§! has proposed a desperate measure: our civilization must retreat underground and enter deep hibernation. Only by sealing ourselves away can we hope to outlast this catastrophe.\n\nYet, dissenting voices among our scientists argue that the planetoid will instead stabilize into orbit as a permanent companion to our world, sparing us from disaster. Time is running out, and we must act decisively."
 whoniverse.367.a:0 "The Triad is wise. Begin preparations for hibernation immediately."
 whoniverse.367.b:0 "Cease this madness! The calculations are surely wrong."

 whoniverse_silurian_hibernation_project:0 "Hibernation Protocol"
 whoniverse_silurian_hibernation_project_DESC:0 "Initiate the deep hibernation of our entire civilization to survive the impending cataclysm.\n\n§RWarning: Finishing this project will have dire consequences for your empire.§!"

 whoniverse.368.name:0 "The Long Sleep"
 whoniverse.368.desc:0 "The §LTriad§! has guided us into the depths of our world, where vast chambers have been prepared for our hibernation. Across the surface, our cities stand silent as the lights fade. With one final command, our civilization surrenders to the embrace of the earth, entrusting our future to the unknown.\n\nAcross the planet, final preparations are made. Entire cities are sealed, and countless lives descend into the earth's embrace. Our civilization will sleep, awaiting the distant day when the atmosphere may recover, and we can reclaim the world that was once ours."
 whoniverse.368.a:0 "Rest now, for the survival of our kind."
 whoniverse.368.a.tooltip:0 "All pops on [This.GetName] have entered irreversible hibernation."

 whoniverse.369.name:0 "The Reckoning"
 whoniverse.369.desc:0 "The moment of reckoning has arrived. The planetoid draws near, its size blotting out the stars and casting a shadow over our lands. Panic grips our society as the realization sinks in: our civilization has not entered hibernation, and the feared calamity appears imminent.\n\nBut as the planetoid closes in, something miraculous occurs. Rather than tearing away our atmosphere, its trajectory shifts. The gravitational forces between it and our world stabilize, drawing it into orbit. This colossal object has become a new celestial body - our §LMoon§!. Relief spreads like wildfire. Against all odds, we have survived, and our civilization endures under the glow of a new guardian in the sky."
 whoniverse.369.a:0 "We have been spared! A new moon graces our skies."
 whoniverse.369.b:0 "Good. Now we must expand across time and space."
 
# Siluria system, anomaly and event

 whoniverse_name_siluria_system:0 "Siluria"
 whoniverse_name_siluria:0 "Siluria Prime"

 whoniverse_siluria_cat:0 "Dinosaur Planet"
 whoniverse_siluria_desc:0 "Our sensors have detected widespread biological signatures across the planet's surface, resembling species thought extinct for eons. The local ecosystem is dominated by dinosaurian lifeforms, with a particularly dense concentration near the remains of a massive, ancient vessel."

 whoniverse.370.name:0 "The Silurian Ark"
 whoniverse.370.desc:0 "Closer investigation reveals that the vessel is an ancient ark, created by the late §LSilurian§! civilization to ensure the survival of their race when their civilization faced extinction. Records from the ark tell a tragic tale: the Silurians it carried were ejected into the void by a marauding pirate, leaving the dinosaurs onboard to drift through space. Eventually, the ark was guided to this planet, where its cargo was released and flourished, transforming the world into a living monument to a bygone age.\n\nIt appears that the savior of the ark, known only as §lthe Doctor§!, named this planet in honor of the Silurians."
 whoniverse.370.a:0 "This is a triumph of survival. Study their adaptation."
 whoniverse.370.b:0 "A rich bounty awaits. Organize a grand hunt!"
 whoniverse.370.c:0 "Exterminate the inferior lifeforms!"
 whoniverse.370.d:0 "Dismantle the ark for its technological secrets."
 whoniverse.370.e:0 "Our legacy endures. Honor those who came before."

 whoniverse_silurian_empire_appeared:0 "§HSilurian Empire§! appears in the §YParallel Universe§! system"

 whoniverse.372.name:0 "Age of the Silurians"
 whoniverse.372.desc:0 "Our ships emerge from the wormhole into what appears to be the Sol system - yet our instruments confirm we have arrived millions of years in the past. The third planet, unmistakably §HEarth§!, is vastly different from the world we know. Sensors detect vast settlements, advanced infrastructure, and a thriving civilization dominating the surface.\n\nThe ruling species appears reptilian, displaying signs of intelligence and technological sophistication. There are no records of such a civilization existing in our time, yet here they stand. Our scientists have designated them as §HSilurians§!."
 whoniverse.372.a:0 "A thriving civilization, millions of years before our time!"
 whoniverse.372.b:0 "We should strike them before they become a threat."
 whoniverse.372.c:0 "EXTERMINATE! This planet belongs to the Daleks!"
 whoniverse.372.d:0 "Assess whether the species is compatible for upgrading."

 whoniverse.373.name:0 "Vestiges of the Past"
 whoniverse.373.desc:0 "Our ships emerge from the wormhole into what appears to be the Sol system - yet our instruments confirm we have arrived millions of years in the past. The third planet, unmistakably §HEarth§!, is vastly different from the world we know. Lush, untamed landscapes stretch across its surface, dominated by prehistoric megafauna.\n\nHowever, scattered across the planet are signs of something more. Ruins, partially buried and worn by time, suggest the presence of an advanced civilization that vanished long ago. No lifeforms matching their possible creators remain, and no clear explanation for their disappearance presents itself. The mystery deepens."
 whoniverse.373.a:0 "A vanished civilization... but why?"
 whoniverse.373.b:0 "Whatever lived here is long gone. Their world is ours to take!"
 whoniverse.373.c:0 "Inferior life forms exterminated themselves!"
 whoniverse.373.d:0 "The organics failed because they didn't upgrade."

 whoniverse_pm_silurian_ruins:0 "Abandoned Cities"

