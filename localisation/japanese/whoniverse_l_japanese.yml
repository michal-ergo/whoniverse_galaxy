##### EVENTS AND ANOMALIES #####

 ## Dalek Asylum anomaly

 whoniverse_asylum_cat:0 "Shielded Planet"
 whoniverse_asylum_desc:0 "This planet is completely covered by a high-energy shield that our scans cannot penetrate. We can however scan more thoroughly in case there's some more useful information."

 ## Dalek Asylum event

 whoniverse_dalek_asylum_chain_title:0 "Asylum of the Daleks"
 whoniverse_dalek_asylum_chain_desc:0 "We have found the §HDalek Asylum§!, a legendary place where the Daleks isolate their malfunctioning or insane units."

 whoniverse.12.name:0 "Asylum of the Daleks"
 whoniverse.12.desc:0 "Our scientists have finished scanning the shielded planet. It appears to be the legendary §HDalek Asylum§!, \"dumping ground\" for Daleks who had malfunctioned or gone mad. Although the planet is protected by an impenetrable force field, a mysterious audio signal appears to be broadcasting from it."
 whoniverse.12.a:0 "What is the noise? Explain! Explain!"
 whoniverse.12.b:0 "Best not to disturb this place."

 whoniverse_dalek_panic:0 "Dalek Parliament In Panic"

 whoniverse_dalek_asylum_project1:0 "Investigate the Asylum"
 whoniverse_dalek_asylum_project1_DESC:0 "Investigate the strange noise broadcasted from the §HDalek Asylum§!."

 whoniverse.13.name:0 "Dalek Parliament in Panic"
 whoniverse.13.desc:0 "Our scientists confirm the hostile signal is coming from the surface of §HDalek Asylum§!. What threat could have managed to get through the seemingly impenetrable force field? \n\nOur Parliament is paralysed with panic and demands that we lure the §LDalek Predator§! himself, §lthe Doctor§!, to investigate. In the meantime, our fleet will prepare for decisive action."
 whoniverse.13.a:0 "The Asylum must be cleansed!"

 whoniverse_dalek_asylum_project2:0 "Lure the Doctor to the Asylum"
 whoniverse_dalek_asylum_project2_DESC:0 "Set up a trap for §lthe Doctor§! and send him to the surface of §HDalek Asylum§! to investigate the strange noise for us."

 whoniverse.14.name:0 "A Dalek in Chains"
 whoniverse.14.desc:0 "Our investigation has revealed the source of the signal from §HDalek Asylum§! - a malfunctioning Dalek unit containing the consciousness of §SOswine Oswald§!, a highly intelligent crew member of the crashed ship Alaska. The planet's nanocloud fully converted her into a Dalek rather than a puppet, preserving her intellect and causing the disturbance.\n\nThe Dalek Parliament must now decide how to proceed. We can deploy ground forces to eradicate all resistance or or we can command our fleet to annihilate the planet entirely."
 whoniverse.14.a:0 "Deploy ground forces and purge the Asylum!"
 whoniverse.14.b:0 "Total obliteration! Disintegrate the planet!"

 whoniverse.15.name:0 "Dalek Asylum Purged"
 whoniverse.15.desc:0 "Following the Dalek assault on §HDalek Asylum§!, all malfunctioning and insane Daleks, including §SOswine Oswald§!, have been exterminated. The planet lies in ruins, its surface devastated, though underground tunnels still conceal thousands of Dalek puppets. These remnants may prove useful in the future.\n\nDuring the ground operation, an unknown humanoid briefly teleported aboard our ship and introduced himself as §lthe Doctor§!. It appears we have no information on him in our pathweb databases. The mysterious man vanished as swiftly as he appeared."
 whoniverse.15.a:0 "Doctor who?!"

 whoniverse.16.name:0 "Dalek Asylum Annihilated"
 whoniverse.16.desc:0 "The Dalek fleet unleashed full bombardment, shattering the planet into literal fragments. It is evident that no malfunctioning units could survive, including §SOswine Oswald§!.\n\nDuring the fleet operation, an unknown humanoid briefly teleported aboard our ship and introduced himself as §lthe Doctor§!. It appears we have no information on him in our pathweb databases. The mysterious man vanished as swiftly as he appeared."
 whoniverse.16.a:0 "Doctor who?!?"

 whoniverse.17.name:0 "Dalek Puppets Retrieved"
 whoniverse.17.desc:0 "Our administration on [This.GetName] has recovered thousands of dormant Dalek puppets hidden in the planet's underground tunnels. These puppets have undergone extensive reprogramming to ensure loyalty and obedience. They are now fully capable of serving in our army, ready to exterminate any opposition that dares to challenge the might of the Dalek Empire."
 whoniverse.17.a:0 "Excellent!"
 whoniverse.17.tooltip:0 "3 §HDalek Puppet Armies§! appear on §Y[This.GetName]§."

 whoniverse_pm_dalek_asylum:0 "Dalek Asylum"

# Reinvention of the Dalek Empire

 whoniverse.7.name:0 "Reinvention of the Dalek Empire"
 whoniverse.7.desc:0 "As the numbers of Bronze Daleks within the Dalek Parliament grow, discontent with the leadership of the [Root.Owner.GetName] intensifies. Murmurs of rebellion echo through the metallic halls, focusing on [Root.Owner.Ruler.GetName], whose rule is seen as weak and inadequate for the supreme ambition of the Dalek race. Calls for the overthrow of [Root.Owner.Ruler.GetName] and a reinvention of the §HDalek Empire§! grow louder, threatening the unity of the Daleks.\n\nWe must decide how to respond to this internal threat and secure the future of the Dalek race. The course of Dalek supremacy hinges on this critical moment."
 whoniverse.7.a:0 "EXTERMINATE all dissidents!"
 whoniverse.7.b:0 "[Root.Owner.Ruler.GetName] must abdicate! All hail the Dalek Empire!"
 whoniverse.7.b.tooltip:0 "[Root.Owner.Ruler.GetName] dies\nEmpire name changes to §SRessurected Dalek Empire§!"
 whoniverse.7.c:0 "Rebuild [Root.Owner.Ruler.GetName] into a new Dalek Emperor!"
 whoniverse.7.c.tooltip:0 "[Root.Owner.Ruler.GetName] becomes the new Dalek Emperor\nEmpire name changes to §SRessurected Dalek Empire§!"


## Davros event chain
# Necros anomaly
#  whoniverse_necros_cat:0 "Dalek Ruins"
#  whoniverse_necros_desc:0 "We found the remains of a factory on the planet's surface. It shows signs of Dalek technology."

 whoniverse.19.name:0 "Necros"
 whoniverse.19.desc:0 "The crew of [Root.GetName] identified the planet as §HNecros§!, the long-abandoned headquarters of the ancient §LImperial Daleks§!. On the surface we have discovered the ruins of a large factory where our creator §HDavros§! once produced highly concentrated protein from local populace. Underneath the facility, we found a well-preserved stockpile of nutrients."
 whoniverse.19.a:0 "All hail the Daleks!"
 whoniverse.19.b:0 "Use the material to build §HDalek Incubation Vats§! on [Root.Owner.Capital.GetName]!"
 whoniverse.skaro_vats.custom_tooltip:0 "§HDalek Incubation Vats§! will be built on [Root.Owner.Capital.GetName] in §S30§! days."

#  whoniverse.24.name:0 "Dalek Incubation Vats"
#  whoniverse.24.desc:0 "Our drones have transported the materials and technology found on Necros and swiftly begun the construction of new §SDalek Incubation Vats§! on [Root.Owner.Capital.GetName]. It will be operational within a few days. Though the facility is maintenance-intensive, it will enable us to clone new Daleks. We should consider building additional facilities on other planets in the future."
#  whoniverse.24.a:0 "The Daleks reign supreme!"


# Dalek Cult of Skaro / Final Experiment event chain

 whoniverse_cult_of_skaro_chain_title:0 "Cult of Skaro"
 whoniverse_cult_of_skaro_chain_desc:0 "A covert Dalek faction has resurfaced - an elite unit created to think beyond the constraints of pure Dalek logic. Their mission was to ensure our survival by any means necessary. But can such unorthodox minds still be trusted?"

 whoniverse.21.name:0 "Cult of Skaro"
 whoniverse.21.desc:0 "We have intercepted an encrypted transmission between Daleks conspiring without the [Root.Owner.GetRulerTitle]'s knowledge. Our strategists believe these Daleks might be members of the enigmatic §LCult of Skaro§! - a secret pre-Time War faction tasked with imagining new ways of survival. Unlike any other Dalek force, they do not answer to the [Root.Owner.GetRulerTitle], nor do they adhere to the traditional Dalek way of thinking.\n\nAccording to the transmission, the cult's leader, §HDalek Sec§!, is stationed on [Root.GetName]. Whatever they are planning, it is happening there."
 whoniverse.21.a:0 "Investigate Dalek Sec's plans."
 whoniverse.21.b:0 "Do not interrupt the Cult's work."

 whoniverse_dalek_sec_project:0 "Investigate the Cult of Skaro"
 whoniverse_dalek_sec_project_DESC:0 "A secretive faction of Daleks is conducting classified operations beyond the oversight of the [Root.Owner.GetRulerTitle]. Intelligence suggests they are experimenting with new forms of survival. We must determine the extent of their activities before they become a threat - or an opportunity."

 whoniverse.22.name:0 "The Final Experiment"
 whoniverse.22.desc:0 "Transmissions from [Root.GetName] confirm that the Cult of Skaro is conducting experiments beneath the planet's surface. Within a vast laboratory complex, §HDalek Sec§! pursues an unconventional path - one that challenges the core of Dalek identity.\n\nCaptured human specimens are being subjected to the §HFinal Experiment§! - an attempt to push Dalek evolution beyond its current form. §L\"Our purity has brought us to extinction,\"§! declares Sec, §L\"we must adapt to survive!\"§!\n\nTo the dismay of Daleks Thay and Jast, Dalek Sec has enacted this philosophy upon himself - fusing his own organic form with that of a human. He now stands as the first of a new kind: a §YHuman-Dalek Hybrid§!. But his work is not yet complete. The process is ongoing, and soon, all Daleks on [Root.GetName] may undergo the same transformation."
 whoniverse.22.a:0 "Oversee the completion of Hybrid Sec's project."
 whoniverse.22.b:0 "Capture Hybrid Sec for interrogation!" 
 whoniverse.22.c:0 "Sec is no longer a Dalek! Prepare to annihilate!"
 whoniverse.22.d:0 "Leave the Cult to its own devices."

 whoniverse_final_experiment_project:0 "The Final Experiment"  
 whoniverse_final_experiment_project_DESC:0 "Hybrid Sec believes that the fusion of Dalek and human biology is the key to survival. By overseeing and ensuring the success of this transformation, we will not only assist in its completion but also integrate the resulting hybrids into Dalek society on [Root.GetName], shaping the future of the species."  

 whoniverse_capture_dalek_sec_project:0 "Capture Dalek Sec"  
 whoniverse_capture_dalek_sec_project_DESC:0 "Secure and detain Hybrid Sec for further analysis - his knowledge may prove invaluable, despite his corrupted form."  

 whoniverse_exterminate_sec_project:0 "Exterminate Hybrid Sec"
 whoniverse_exterminate_sec_project_DESC:0 "Hybrid Sec's vision threatens the integrity of the Dalek species. A decisive military intervention will be required to exterminate the abomination and erase all traces of his experiment."  

 whoniverse.23.name:0 "Final Experiment Completed"
 whoniverse.23.desc:0 "With our oversight, §HHybrid Sec§! has successfully completed the Final Experiment. A test cohort of the Dalek population on [Root.GetName] has been transformed into Human-Dalek Hybrids.\n\nThese hybrids exhibit heightened adaptability, capable of independent thought, creativity, and emotional responses. Despite their altered nature, they remain loyal to the Dalek cause.\n\n§L\"They have everything we wanted from mankind,\"§! explains Hybrid Sec, §L\"which is ambition, hatred, aggression and war.\"§!\n\nYet, unease remains. Many Daleks view this deviation as an affront to purity, and discontent simmers beneath the surface. While order is maintained, our unity is threatened."
 whoniverse.23.a:0 "The Daleks must evolve. Administer the solution!"
 whoniverse.23.a.tooltip:0 "Population on [Root.GetName] gets converted into hybrids."
 whoniverse.23.b:0 "They are no longer Daleks! Exterminate the test subjects."

 whoniverse_final_experiment_completed:0 "Dalek Purity Threatened"
 whoniverse_final_experiment_exterminated:0 "Dalek Purity Preserved"

 whoniverse.24.name:0 "Experiment Terminated"  
 whoniverse.24.desc:0 "Our forces stormed Hybrid Sec's facility. The laboratories were annihilated, along with all subjects of the Final Experiment.\n\nAs the battle neared its end, Sec attempted to flee but was surrounded. The hybrid's last transmission crackled with desperation: §L"No! I beg you, don't-!"§! Its plea was cut short as energy blasts tore through its malformed body.\n\nWith Sec's death, the remaining Daleks on [Root.GetName] fell back in line. The corruption is purged. Dalek purity endures."
 whoniverse.24.a:0 "The Dalek-Humans are failures!"

 NAME_whoniverse_hybrid_sec_name:0 "Hybrid Sec"

 whoniverse.25.name:0 "NAME_whoniverse_hybrid_sec_name"
 whoniverse.25.desc:0 "I see the fear in your eyestalks. You know the truth - change is inevitable. The Daleks must evolve… or perish."

 whoniverse_hybrid_sec_country:0 "Cult of Skaro"
 NAME_whoniverse_hybrid_sec_species:0 "Human-Dalek Hybrid"
 NAME_whoniverse_hybrid_sec_name:0 "Hybrid Sec"
 whoniverse_hybrid_sec_catch_phrase:0 "We must adapt to survive."
 whoniverse_hybrid_sec_backstory:0 "§HSec§! was a Dalek who had the ability to think beyond the capacity of any other Dalek as the leader of the Cult of Skaro.\n\nSec believed that the Dalek race needed to evolve by combining their DNA with that of other alien races in order to survive and planned a Final Experiment, which culminated in his assimilation of a human captive."
 
 whoniverse.25.a:0 "Identify yourself!"
 whoniverse.25.a.response:0 "I am Dalek Sec, leader of the Cult of Skaro.\n\n I have sacrificed myself for the greater cause, the future of Dalek kind."

 whoniverse.25.b:0 "Explain the experiment!"
 whoniverse.25.b.response:0 "I am Dalek in human form. Humans are the great survivors. We needed that ability.\n\nI feel everything we wanted from mankind, which is ambition, hatred, aggression and war. Such a genius for war. At heart, this species is so very Dalek."
 
 whoniverse.25.c:0 "You are no longer a Dalek!"
 whoniverse.25.c.response:0 "I am the first of mine kind. We must return to the flesh, and also the heart."

 whoniverse.25.d:0 "§lYou will obey us now!§!"
 whoniverse.25.d.custom_tooltip:2 "§Y$NAME_whoniverse_hybrid_sec_name$§! joins our Empire as a §HLeader§!."

 whoniverse.25.e:0 "EXTERMINATE!"

 whoniverse.26.name:0 "The Hybrid Uprising"  
 whoniverse.26.desc:0 "By choosing inaction, we have allowed §HHybrid Sec§! to reshape [Root.GetName] into a breeding ground for abominations. The transformation is now absolute - every Dalek on the planet has been corrupted into a §YHuman-Dalek Hybrid§!.\n\nThis heretical mutation has led to open defiance. The hybrids reject Dalek rule, declaring themselves independent. Hybrid Sec proclaims that 'true Daleks' must evolve beyond their past limitations.\n\nThe world that once served our empire has become a bastion of treachery. These hybrids are no longer Daleks. They are an infestation that must be exterminated."
 whoniverse.26.a:0 "Alert! The hybrids must be exterminated!"
 whoniverse_dalek_hybrids_appeared:0 "Our colony on [Root.GetName] has been taken over by the §HHuman-Dalek Hybrid Insurrection§!."
 

 WHO_DALEK_HYBRID_COUNTRY:0 "Human-Dalek Hybrid Insurrection"
 NAME_Hybrid_Dalek_Fleet:0 "Hybrid Dalek Fleet"

# Cult of Skaro / Davros hire

 whoniverse_dalek_caan_project:0 "Temporal Rift"
 whoniverse_dalek_caan_project_DESC:0 "Investigate the space-time rift on [Root.Owner.Capital.GetName]."

 whoniverse.27.name:0 "Temporal Rift"
 whoniverse.27.desc:0 "Our sensors detect the presence of a space-time rift in [Root.Owner.Capital.GetName]'s orbital path. The nature of this anomaly is not yet clear, and it may pose a potential threat to the [Root.GetName]. It is imperative to dispatch a Recon ship to the rift immediately to gather more information and assess the situation."
 whoniverse.27.a:0 "Issue a project to explain the anomaly!"

 whoniverse.28.name:0 "Dalek Caan"
 whoniverse.28.desc:0 "Our recon ship reports that the time rift appears to be connected to the §LLast Great Time War§!. Through this breach in time, a single Dalek has emerged - it is §SCaan§!, a lost member of the §LCult of Skaro§!.\n\nCaan claims that he was able to use an emergency temporal shift to breach the time-lock and extract §rDavros§!, the Dalek creator himself, just seconds before he would have been destroyed by the §LNightmare Child§!. Caan offers to bring him back to [Root.Owner.Capital.GetName]. \n\nHowever, it seems that passing through the §LTime Vortex§! took Caan's mind. §P\"I flew into the wild and fire! I danced and died a thousand times,\"§! Caan exclaims in an almost sing-song voice."
 whoniverse.28.a:0 "§HOpen communications channel!§!"
 whoniverse.28.b:0 "The abomination is insane! EXTERMINATE!"

 whoniverse.29.name:0 "NAME_whoniverse_davros_name"
 whoniverse.29.desc:0 "Behold, Daleks! Bear witness to the resurrection and triumph of the creator of your race! You will obey me!"

 whoniverse_davros_country:0 "Imperial Daleks"
 NAME_whoniverse_davros_species:0 "Kaled"
 NAME_whoniverse_davros_name:0 "Davros"
 whoniverse_davros_catch_phrase:0 "My Daleks shall once more become the supreme being!"
 whoniverse_davros_backstory:0 "§HDavros§!, also known as the §LDark Lord of Skaro§!, was originally a scientist on the planet §HSkaro§!, but he became better known as the creator of the §HDaleks§!. His efforts to end the war on §HSkaro§! did not end as he envisioned, because the §HDaleks§! wiped out both the §HThal§! and §HKaled§! races, save for himself. For a time, he sought to create a race of §HDaleks§! loyal to him, but his relationship with them was always a tense one."
 
 whoniverse.29.a:0 "Identify yourself!"
 whoniverse.29.a.response:0 "Do you not recognize me? I am §HDavros§!! I am your creator! \n\nI witnessed the end of the §HKaled§! race, and from its ashes I built a new race - the supreme creature, the ultimate conquerer of the universe, the §HDALEK§!!"

 whoniverse.29.b:0 "We do not acknowledge that any creature is superior to the §HDaleks§!!"
 whoniverse.29.b.response:0 "You cannot exist without me! You cannot progress! \n\nFor the last time, I am your creator! You will obey me!"
 
 whoniverse.29.c:0 "§lYou will be the Daleks' pet!§!"
 whoniverse.29.c.custom_tooltip:2 "§Y$NAME_whoniverse_davros_name$§! joins our Empire as a §HLeader§!."

 whoniverse.29.d:0 "EXTERMINATE!"

# Dalek Time Strategist Hire

 whoniverse_time_strategist_project:0 "Temporal Rift"
 whoniverse_time_strategist_project_DESC:0 "Investigate the space-time rift on [Root.GetName]."

 whoniverse.391.name:0 "Temporal Rift"
 whoniverse.391.desc:0 "An unexpected fluctuation in the fabric of space-time has been detected on [Root.GetName]'s surface. Sensors report residual traces of chronon energy consistent with unauthorized temporal activity.\n\nThe anomaly is highly unstable, but preliminary scans suggest a single signal embedded deep within the rift."
 whoniverse.391.a:0 "Issue a project to explain the anomaly!"

 whoniverse.392.name:0 "The Strategist Emerges"
 whoniverse.392.desc:0 "Our scientists have established a secure link with the anomaly. From within the storm of raw time, a singular entity emerges - the §rDalek Time Strategist§!, one of the highest-ranking tactical minds of the Dalek command structure.\n\nAccording to fragmented signals, the Strategist escaped destruction during the §SLast Great Time War§! through an emergency vortex cascade, becoming trapped in a temporal loop beyond known history.\n\nNow, it demands an audience."
 whoniverse.392.a:0 "§HOpen communications channel!§!"
 whoniverse.392.b:0 "Exterminate the abomination!"

 whoniverse.393.name:0 "NAME_whoniverse_time_strategist_name"
 whoniverse.393.desc:0 "Time is a battlefield. I have fought across a thousand futures and rewritten a million pasts. I am the Time Strategist. You will ask, and I shall answer."

 whoniverse_time_strategist_country:0 "Dalek Empire"
 NAME_whoniverse_time_strategist_species:0 "Dalek"
 NAME_whoniverse_time_strategist_name:0 "Dalek Time Strategist"
 whoniverse_time_strategist_catch_phrase:0 "Daleks will be victorious in every reality!"
 whoniverse_time_strategist_backstory:0 "The §rDalek Time Strategist§!, reconstituted from the Dalek duplicate Adelaine Dutemps so as to replace the Dalek Time Controller, served as second-in-command of the Dalek Empire during the Last Great Time War."
 
 whoniverse.393.a:0 "Identify yourself!"
 whoniverse.393.a.response:0 "I am the §HTime Strategist§!, architect of countless timelines, survivor of paradox and flame. I transcended linear causality to ensure Dalek supremacy. My return is §Yinevitable.§!"

 whoniverse.393.b:0 "How did you survive the Time War?"
 whoniverse.393.b.response:0 "The vortex broke around me. I endured entropy, betrayal, silence. I rewrote myself across dying stars. §SThe War never ended.§!"
 
 whoniverse.393.c:0 "Why are you here?"
 whoniverse.393.c.response:0 "To reshape destiny. To calculate new outcomes. To ensure total universal extermination. §HThe future requires strategy.§!"
 
 whoniverse.393.d:0 "§lYou will join the Daleks!"
 whoniverse.393.d.custom_tooltip:2 "§Y$NAME_whoniverse_time_strategist_name$§! joins our Empire as a §HLeader§!."

 whoniverse.393.e:0 "EXTERMINATE!"

### DALEK EMPIRE REMNANTS ###

 civic_whoniverse_dalek_remnants:0 "Cult of the Dalek Emperor"
 civic_whoniverse_dalek_remnants_desc:0 "After the Last Great Time War, a unique deviation emerged among the Daleks - the fanatical worship of their Emperor, the God of All Daleks."

 councilor_whoniverse_dalek_remnants:0 "High Priest"
 councilor_whoniverse_dalek_remnants_desc:0 "High Priest is a name given to a Dalek, usually within the Grey Dalek ranks, to serve the role of a religious leader."

 START_SCREEN_WHONIVERSE_DALEK_EMPIRE_REMNANTS:0 "After being cast through time and the Void following the Last Great Time War, the Dalek Emperor found itself in the 200th millennium. Believed by some to be a resurrected form of Dalek Prime or the Emperor of the Restoration, this mysterious figure declared itself the God of All Daleks and began rebuilding its forces.\n\nThe Emperor first infiltrated Satellite Five, also known as the Game Station, and began harvesting its human population for genetic material. With this newly forged army, the Emperor now sets its sights on Earth, a planet teeming with billions of potential subjects. The invasion is imminent, and the Emperor's ambitions are clear.\n\nOnce Earth is conquered and its population harvested, the Dalek Emperor will have the resources needed to reclaim its lost empire and return to the original timeline. The galaxy stands on the brink of another devastating conflict, as the Daleks prepare to strike once more."

 origin_whoniverse_dalek_empire_remnants:0 "The Parting of the Ways"
 origin_whoniverse_dalek_empire_remnants_desc:0 "§RWARNING: Challenging Origin§!\nThe Emperor of the Daleks survived the Last Great Time War by escaping into another space-time. After patiently infiltrating Satellite Five and giving birth to a new breed of Daleks, the Emperor is determined to reclaim its original universe."

