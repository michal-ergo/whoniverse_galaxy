 ap_whoniverse_dalek_desc:0 "The Daleks are the supreme beings of the universe. Through relentless evolution, technological mastery, and genetic purity, we shall achieve ultimate perfection."
 whoniverse_ap_dalek_tooltip:0 " Unlocks the §Y$tradition_whoniverse_dalek$§! tradition tree"

### DALEK TRADITION TREE ###
 tradition_whoniverse_dalek:0  "Dalek Ascension"
 tradition_whoniverse_dalek_desc:0 "The Daleks will become the supreme rulers of the universe!"

 requires_not_ap_whoniverse_dalek:0 "$TRIGGER_FAIL$May not have the §Y$ap_synthetic_evolution$§! Ascension Perk.""
 
 tr_whoniverse_dalek_adopt:0 "Bacterial Bombardment"
 tr_whoniverse_dalek_finish:0 "Destiny of the Daleks"
 tr_whoniverse_dalek_finish_desc:0 "§G+2§! Genetic modification points\n§G+1§! Organic species trait picks\n§G-40%§! Modify Species special project cost\nGenetic modification can add §YDalek Variant§! traits"

 tr_whoniverse_dalek_conversion:0 "Human-Dalek Conversion"
 tr_whoniverse_dalek_conversion_delayed:0 "The ancestral Kaleds were indistinguishable from humans. As such, we could use human DNA as a resource for cloning new Dalek mutants."
 tr_whoniverse_dalek_conversion_desc:0 "['concept_whoniverse_dalek_incubation_vats'] produce an additional §G+2§! §YMonthly Organic Pop Assembly§!\nUnlocks §GHuman-Dalek Conversion§! purge type for Human species"
 tr_whoniverse_dalek_emergency:0 "Emergency Temporal Shift"
 tr_whoniverse_dalek_emergency_desc:0 "Ship Combat Disengagement Chance: §G+15%§!\nGuaranteed Research Option: §GJump Drive§!"
 tr_whoniverse_dalek_emergency_delayed:0 "A temporal shift is a form of spatial shift that can be used to move beings through time and space to a new destination."
 tr_whoniverse_dalek_progenitor:0 "Progenitor Device"
 tr_whoniverse_dalek_progenitor_delayed:0 "We can design special devices containing pure Dalek DNA, that can both reproduce full-grown Dalek mutants and functional battle armour."
 tr_whoniverse_dalek_progenitor_desc:0 "§G+10%§! Habitability\n§G+2§! Organic species trait picks\nGenetic modification can remove positive traits"
 tr_whoniverse_dalek_nanocloud:0 "Nanocloud Virus"
 tr_whoniverse_dalek_nanocloud_delayed:0 "Using nanogenes, we can wrap our planets in protective nanoclouds that will convert any other organisms into Dalek puppets."
 tr_whoniverse_dalek_nanocloud_desc:0 "§C['concept_whoniverse_dalek_incubation_vats']§!: §G+1§! £mod_job_necromancer_add£ $job_necromancer$ jobs"
 tr_whoniverse_dalek_pathweb:0 "Pathweb"
 tr_whoniverse_dalek_pathweb_delayed:0 "The Pathweb or the "Dalek hive mind" is an artificial telepathic network containing information on Dalek history and experiences."

 council_agenda_agenda_whoniverse_dalek_supremacy_name:0 "Dalek Supremacy"
 council_agenda_agenda_whoniverse_dalek_supremacy_desc:0 "The Daleks can survive only by becoming the dominant species - be it through genetic engineering or by means of conquest."

 agenda_whoniverse_dalek_supremacy_finish:0 "Dalek Supremacy"

 trait_whoniverse_dalek_spider:0 "Spider Variant"
 trait_whoniverse_dalek_spider_desc:0 "Designed for hostile and confined environments, these Daleks move with terrifying speed and crawl where others cannot."

 trait_whoniverse_dalek_special:0 "Special Weapons Variant"
 trait_whoniverse_dalek_special_desc:0 "Armed with devastating weaponry, these Daleks sacrifice all subtlety in favor of overwhelming destructive firepower."

 trait_whoniverse_dalek_time:0 "Time-Sensitive Variant"
 trait_whoniverse_dalek_time_desc:0 "Empowered with an innate understanding of temporal flows, these Daleks adapt quickly, thinking and acting ahead of their enemies."

 trait_whoniverse_dalek_recon:0 "Reconnaissance Variant"
 trait_whoniverse_dalek_recon_desc:0 "Light, agile, and efficient, these Daleks excel at surveying and exploiting their surroundings with minimal resources."

 trait_whoniverse_dalek_psyche:0 "Psyche Variant"
 trait_whoniverse_dalek_psyche_desc:0 "Their psychokinetic abilities elevate them above mere machines, exerting their willpower to shape reality and dominate lesser minds."


### DALEK ORIGIN, SPECIES AND EMPIRE ###

 civic_whoniverse_new_dalek_paradigm:0 "New Dalek Paradigm"
 civic_whoniverse_new_dalek_paradigm_desc:0 "A revolutionary shift in Dalek evolution, the New Dalek Paradigm embraces genetic and functional diversity, creating specialized variants to ensure the ultimate supremacy of the Dalek race."

 councilor_whoniverse_new_dalek_paradigm:0 "Dalek Eternal"
 councilor_whoniverse_new_dalek_paradigm_desc:0 "Dalek Eternal is a name given to a specialised Dalek, usually within the Yellow Dalek ranks, to serve the role of a mystical advisor."

# Dalek Origin - no color in desc
 origin_whoniverse_new_dalek_paradigm:0 "Victory of the Daleks"
 origin_whoniverse_new_dalek_paradigm_desc:0 "Through the activation of the Progenitor Device, a new generation of pure Daleks has emerged, free of the flaws of their predecessors. With unwavering resolve and unparalleled design, these Daleks seek to establish their dominion across the stars, eradicating all who stand in their way."
#  origin_whoniverse_new_dalek_paradigm_desc:0 "The New Dalek Paradigm is a revitalized force, emerging stronger from near annihilation and driven by an unyielding desire for conquest. These evolved Daleks are designed for absolute extermination of all inferior life forms."
 
 NAME_ressurected_dalek_empire:0 "Ressurected Dalek Empire"

